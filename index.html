 else if(k==="sty"){S.sty=S.sty||{};S.sty[f]=Number(v);document.getElementById("ex-"+f).textContent=STY[f][Number(v)][1];save();return}
 else if(k==="w"){S.warnAll=v==="1";save();return}
 else if(k==="ln"){const c=chap(a);if(c){const tl=c.tr.split("\n");tl[Number(f)]=e.target.textContent;c.tr=tl.join("\n")}save();return}
 else if(k==="q"){S.q=v;$("#gl").innerHTML=glRows();return}
 else if(k==="ch"){const c=chap(a);if(c){c[f]=v;if(f==="src")$("#found").innerHTML=found(c)}}
 save();
});
document.addEventListener("click",e=>{
 if(S.pop&&!e.target.closest(".pop,[data-a=add]")){S.pop=false;render()}
 const t=e.target.closest("[data-a]");if(!t)return;
 const a=t.dataset.a,id=t.dataset.id,d=$("#dlg");
 const A={
  tab:()=>go(t.dataset.k),back:()=>go("ch"),
  mode:()=>{S.mode=t.dataset.m;render();save()},
  flt:()=>{S.filter=t.dataset.k;render()},
  sort:()=>{S.desc=!S.desc;render();toast(S.desc?"เรียงจากตอนล่าสุด":"เรียงจากตอนแรก")},
  sel:()=>{S.sel=t.checked?[...S.sel,id]:S.sel.filter(x=>x!==id);render()},
  selall:()=>{S.shOpen=false;const ids=S.chapters.filter(c=>S.filter==="all"||(S.filter==="fix"&&issues(c).length)||(S.filter==="todo"&&!c.tr.trim())||(S.filter==="done"&&c.tr.trim())).map(c=>c.id);S.sel=t.checked?[...new Set([...S.sel,...ids])]:S.sel.filter(x=>!ids.includes(x));render()},
  delsel:()=>{if(!S.sel.length)return toast("เลือกตอนที่ต้องการลบก่อน");ask("ลบ "+S.sel.length+" ตอนที่เลือกใช่ไหม",()=>{S.chapters=S.chapters.filter(c=>!S.sel.includes(c.id));S.sel=[];render();save()})},
  open:()=>{d.open&&d.close();S.cur=id;S.last=id;S.es=chap(id)&&chap(id).tr.trim()?"tr":"src";go("ed")},
  menu:()=>dlg('<b>'+esc((chap(id)||{}).title)+'</b><div class="set"><button data-a="open" data-id="'+id+'">เปิดแก้ไข</button><button data-a="gemd" data-id="'+id+'">แปลด้วย Gemini</button><button class="del" data-a="del1" data-id="'+id+'">ลบตอนนี้</button><button data-a="close">ปิด</button></div>'),
  gemd:()=>{d.close();transOne(id)},
  del1:()=>ask("ลบตอนนี้ใช่ไหม",()=>{S.chapters=S.chapters.filter(c=>c.id!==id);S.sel=S.sel.filter(x=>x!==id);render();save()}),
  yes:()=>{d.close();const f=YES;YES=null;if(f)f()},
  close:()=>d.close(),
  add:()=>{S.pop=!S.pop;render()},
  pickfile:()=>{S.pop=false;render();$("#fi").click()},
  paste:()=>{S.pop=false;render();dlg('<b>วางข้อความ</b><div class="set"><input id="nti" placeholder="ชื่อตอน"><textarea id="nsr" placeholder="วางข้อความต้นฉบับ (เว้นว่างได้)"></textarea><button class="pri" data-a="addsave">เพิ่มตอน</button><button data-a="close">ปิด</button></div>')},
  addsave:()=>{const c={id:uid(),title:$("#nti").value.trim()||"ตอนที่ "+(S.chapters.length+1),src:$("#nsr").value,tr:""};S.chapters.push(c);d.close();render();save();toast("เพิ่มตอนแล้ว")},
  run:runAuto,selall2:()=>{S.shOpen=false;S.sel=S.sel.length===S.chapters.length?[]:S.chapters.map(c=>c.id);render()},sbex:()=>exAll(S.chapters.filter(c=>S.sel.includes(c.id))),sbtr:()=>{S.shOpen=true;render()},shclose:()=>{S.shOpen=false;render()},shx:()=>{S.exf=t.dataset.v==="1";save();render()},shgo:()=>{S.shOpen=false;runAuto(true)},shex:()=>{S.shOpen=false;exAll(S.chapters.filter(c=>S.sel.includes(c.id)))},chm:()=>{d.open&&d.close();S.shOpen=false;go("cfg")},togl:()=>{d.open&&d.close();go("gl")},
rc:()=>{const L=S.chapters.filter(c=>c.tr.trim()),k=L.findIndex(c=>c.id===S.rc)+Number(t.dataset.d);if(L[k]){S.rc=L[k].id;S.ri=0;render();$("#v").scrollTop=0}},ob:()=>{S.ob=t.checked;render()},rv:()=>{const c=chap(S.rc),n=lines(c).filter(l=>l.bad.length).length;if(n){S.ri=((S.ri||0)+Number(t.dataset.d)+n)%n;S.sc=true;render()}},ok:()=>{const c=chap(S.rc),b=lines(c).filter(l=>l.bad.length)[S.ri||0];if(b){c.ig=c.ig||{};c.ig[b.i]=1;S.sc=true;render();save()}},fixl:()=>fixLine(id,Number(t.dataset.i)),
ge:()=>{S.ge=S.ge===id?null:id;$("#gl").innerHTML=glRows()},ga:()=>{S.ga=!S.ga;render()},exall:()=>exAll(S.chapters),exone:()=>{const c=chap(S.cur);if(c){c.ex=false;exAll([c])}},exf:()=>{S.exf=t.checked;save()},
stop:()=>{STOP=true;toast("กำลังหยุด...")},
  es:()=>{S.es=t.dataset.s;$(".ed").dataset.s=S.es;render()},
  gem:()=>transOne(id),
  apply:()=>{const c=chap(S.cur),ta=$("#tt");let v=ta.value,n=0;[...S.glossary].filter(g=>g.src&&g.tr).sort((x,y)=>y.src.length-x.src.length).forEach(g=>{const p=v.split(g.src);n+=p.length-1;v=p.join(g.tr)});ta.value=v;c.tr=v;save();toast("แทนที่ศัพท์ "+n+" จุด")},
  ins:()=>{const c=chap(S.cur),ta=$("#tt"),x=t.dataset.t,s=ta.selectionStart==null?ta.value.length:ta.selectionStart,e2=ta.selectionEnd==null?s:ta.selectionEnd;ta.value=ta.value.slice(0,s)+x+ta.value.slice(e2);ta.selectionStart=ta.selectionEnd=s+x.length;c.tr=ta.value;save();toast("แทรก “"+x+"” แล้ว")},
  pickterm:()=>{const ta=$("#ts"),w=ta.value.slice(ta.selectionStart,ta.selectionEnd).trim();if(!w)return toast("เลือกข้อความในช่องต้นฉบับก่อน");S.pre=w;go("gl")},
  copy:()=>cp(($("#tt")||{}).value||"","คัดลอกคำแปลแล้ว"),
  addterm:()=>{const s=$("#ns").value.trim(),r=$("#nt").value.trim();if(!s||!r)return toast("กรอกทั้งคำต้นฉบับและคำแปล");S.glossary.unshift({id:uid(),u:1,at:Date.now(),src:s,tr:r,cat:$("#nc").value,note:$("#nn").value.trim()});S.ga=false;render();save()},
  delg:()=>{S.glossary=S.glossary.filter(g=>g.id!==id);$("#gl").innerHTML=glRows();nav();save()},
  rd:()=>{const L=S.chapters,i=L.findIndex(c=>c.id===S.last)+Number(t.dataset.d);if(L[i]){S.last=L[i].id;render();$("#v").scrollTop=0;save()}},
  fs:()=>{S.fs=Math.min(30,Math.max(14,S.fs+Number(t.dataset.d)*2));render();save()},
  bk:()=>dlg('<b>สำรอง / นำเข้าข้อมูล</b><p class="mute">คัดลอกข้อความนี้เก็บไว้ หรือวางข้อมูลที่สำรองไว้แล้วกดนำเข้า (นำเข้าจะแทนที่ข้อมูลปัจจุบัน คีย์ Gemini ไม่รวมอยู่ในข้อมูลสำรอง)</p><textarea id="js">'+esc(JSON.stringify({proj:S.proj,chapters:S.chapters,glossary:S.glossary}))+'</textarea><div class="bar" style="margin-top:8px"><button data-a="cpj">คัดลอก</button><button class="pri" data-a="imp">นำเข้า</button><button data-a="close">ปิด</button></div>'),
  cpj:()=>cp($("#js").value,"คัดลอกข้อมูลสำรองแล้ว"),
  imp:()=>{try{const j=JSON.parse($("#js").value);if(!Array.isArray(j.chapters)||!Array.isArray(j.glossary))throw 0;S=Object.assign(def(),S,{proj:j.proj||S.proj,chapters:j.chapters,glossary:j.glossary,sel:[],cur:null,last:null,tab:"ch"});d.close();render();save();toast("นำเข้าข้อมูลแล้ว")}catch(x){toast("รูปแบบข้อมูลไม่ถูกต้อง")}}
 };
 if(A[a])A[a]();
});
function cp(txt,msg){const ok=()=>toast(msg),fb=()=>{const ta=document.createElement("textarea");ta.value=txt;document.body.append(ta);ta.select();try{document.execCommand("copy");ok()}catch(e){toast("คัดลอกไม่ได้ ลองเลือกข้อความแล้วคัดลอกเอง")}ta.remove()};
 if(navigator.clipboard)navigator.clipboard.writeText(txt).then(ok,fb);else fb()}
async function readText(f){
 if(/\.docx$/i.test(f.name)){if(!window.mammoth)throw new Error("โหลดตัวอ่าน DOCX ไม่ได้ (ต้องต่ออินเทอร์เน็ต)");return (await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value}
 const b=await f.arrayBuffer();
 try{return new TextDecoder("utf-8",{fatal:true}).decode(b)}catch(e){return new TextDecoder("gb18030").decode(b)}
}
$("#fi").onchange=async e=>{
 const fs=[...e.target.files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));let n=0,bad=[];
 toast("กำลังนำเข้า "+fs.length+" ไฟล์...");
 for(const f of fs){try{S.chapters.push({id:uid(),title:f.name.replace(/\.(txt|docx)$/i,""),src:(await readText(f)).trim(),tr:""});n++}catch(x){bad.push(f.name+": "+x.message)}}
 e.target.value="";render();save();
 toast(bad.length?"นำเข้า "+n+" ไฟล์ ไม่สำเร็จ "+bad.length+" ไฟล์ ("+bad[0]+")":"นำเข้า "+n+" ตอนแล้ว เรียงตามชื่อไฟล์");
};
render();
</script>
